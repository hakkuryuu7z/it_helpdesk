services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: helpdesk_db
      DB_USERNAME: postgres
      DB_PASSWORD: dev_secret_password
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpdesk_network

  nginx:
    image: nginx:1.27-alpine
    container_name: helpdesk_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - helpdesk_network

  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_secret_password
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: helpdesk_db
      DB_USERNAME: postgres
      DB_PASSWORD: dev_secret_password
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: helpdesk_db
      DB_USERNAME: postgres
      DB_PASSWORD: dev_secret_password
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk_network

volumes:
  helpdesk_pgdata:

networks:
  helpdesk_network:
    driver: bridge

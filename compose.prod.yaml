services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: helpdesk_app:prod
    container_name: helpdesk_app_prod
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - helpdesk_app_public:/var/www/html/public
      - helpdesk_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpdesk_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: helpdesk_nginx_prod
    restart: always
    ports:
      - "${APP_PORT:-8087}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - helpdesk_app_public:/var/www/html/public:ro
      - helpdesk_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - helpdesk_internal

  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-helpdesk_db}
      POSTGRES_USER: ${DB_USERNAME:-helpdesk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - helpdesk_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-helpdesk_user} -d ${DB_DATABASE:-helpdesk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_internal

  queue:
    image: helpdesk_app:prod
    container_name: helpdesk_queue_prod
    restart: always
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--stop-when-empty=false"]
    env_file:
      - .env
    volumes:
      - helpdesk_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk_internal

  scheduler:
    image: helpdesk_app:prod
    container_name: helpdesk_scheduler_prod
    restart: always
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    volumes:
      - helpdesk_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk_internal

  whatsapp-gateway:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: helpdesk_whatsapp_gateway:prod
    container_name: helpdesk_whatsapp_gateway_prod
    restart: always
    volumes:
      - helpdesk_baileys_auth:/app/auth_info_baileys
    environment:
      PORT: 3000
    networks:
      - helpdesk_internal

volumes:
  helpdesk_pgdata_prod:
  helpdesk_app_public:
  helpdesk_storage:
  helpdesk_baileys_auth:

networks:
  helpdesk_internal:
    driver: bridge
